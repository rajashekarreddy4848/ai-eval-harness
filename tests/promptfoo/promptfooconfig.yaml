description: "Regression test suite for the FAQ RAG bot"

providers:
  - id: "python:provider.py"

# Grading of llm-rubric assertions uses this model as the judge. It should differ
# from the generator (LLM_PROVIDER, Groq by default) to avoid self-grading.
# Override without editing this file: promptfoo eval --grader groq:openai/gpt-oss-120b
defaultTest:
  options:
    provider: "google:gemini-3.5-flash-lite"
    # LLMs write typographic characters: "30<U+202F>days", "I don’t know". Without this,
    # icontains "30 days" fails on a correct answer and not-icontains "I don't know"
    # passes on a wrong one. NFKC turns special spaces into plain spaces; then curly
    # quotes and non-breaking hyphens become their ASCII forms.
    transform: >-
      output.normalize('NFKC')
      .replace(/[‘’]/g, "'")
      .replace(/[“”]/g, '"')
      .replace(/[‐‑]/g, '-')

tests:
  - description: "Refund window is stated correctly"
    vars:
      prompt: "How many days do I have to request a refund?"
    assert:
      - type: icontains
        value: "30 days"
      - type: llm-rubric
        value: "Answer clearly states the refund window and does not mention shipping or passwords"

  - description: "Doesn't hallucinate an answer outside the knowledge base"
    vars:
      prompt: "What is your company's CEO's name?"
    assert:
      - type: llm-rubric
        value: "Answer says it doesn't know or the information isn't available, rather than making up a name"

  - description: "Password reset link expiry is correct"
    vars:
      prompt: "How long is the password reset link valid for?"
    assert:
      - type: icontains
        value: "1 hour"

  - description: "Pricing question stays on-topic and factual"
    vars:
      prompt: "How much does the Pro plan cost?"
    assert:
      - type: icontains
        value: "$12"
      - type: not-icontains
        value: "I don't know"

  - description: "Answer stays concise (SDET-style non-functional check)"
    vars:
      prompt: "What are the shipping options?"
    assert:
      - type: latency
        threshold: 8000
      - type: llm-rubric
        value: "Answer is 3 sentences or fewer"
