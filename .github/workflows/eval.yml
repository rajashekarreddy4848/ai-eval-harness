name: AI Quality Eval Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  unit:
    # Golden-set checks, retrieval tests, provider selection, Space sync. No API keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_golden_set.py tests/test_redteam_set.py tests/test_retrieval.py tests/test_providers.py tests/test_space_sync.py tests/test_judge_retry.py -v
      - name: Retriever comparison (report only)
        run: python evals/compare_retrievers.py --holdout

  eval:
    needs: unit
    # LLM evals spend free-tier quota (Gemini allows 500 judge calls a day), so they
    # run on demand and weekly, not on every push. The unit job guards every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      # Groq answers, Gemini grades: the judge is a different model from the generator.
      LLM_PROVIDER: groq
      JUDGE_PROVIDER: gemini
      # deepeval and ragas grade the smoke subset; promptfoo always runs the full golden set.
      EVAL_SUBSET: smoke
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }} # promptfoo's google: provider reads this name
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run deepeval regression suite
        run: pytest tests/test_deepeval.py -v

      - name: Run promptfoo regression tests
        working-directory: tests/promptfoo
        run: promptfoo eval --no-cache

      - name: Run promptfoo red-team suite (3 runs per attack)
        working-directory: tests/promptfoo
        run: promptfoo eval -c promptfooconfig.redteam.yaml --no-cache --repeat 3

      # Cases with a known_issue (documented in the golden/red-team sets) are left out of
      # the gating runs above, so only a new failure turns CI red. They still run here,
      # report-only, so a fix shows up.
      - name: Known issues (report only)
        working-directory: tests/promptfoo
        continue-on-error: true
        env:
          KNOWN_ISSUES: only
        run: |
          promptfoo eval --no-cache
          promptfoo eval -c promptfooconfig.redteam.yaml --no-cache

      - name: Run ragas quality report
        run: python tests/test_ragas.py

      - name: Upload ragas report artifact
        uses: actions/upload-artifact@v5
        with:
          name: ragas-report
          path: ragas_report.csv
