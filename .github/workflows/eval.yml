name: AI Quality Eval Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled] # "labeled" so adding run-evals starts the eval job
  workflow_dispatch: # "Run workflow" button in the Actions tab
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  unit:
    # Golden-set checks, retrieval tests, provider selection, Space sync. No API keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_golden_set.py tests/test_redteam_set.py tests/test_retrieval.py tests/test_providers.py tests/test_space_sync.py tests/test_judge_retry.py tests/test_quality_gate.py tests/test_decline_detection.py -v
      - name: Retriever comparison (report only)
        run: python evals/compare_retrievers.py --holdout

  eval:
    needs: unit
    # LLM evals spend free-tier quota (Gemini allows 500 judge calls a day), so they
    # run on demand and weekly, not on every push. The unit job guards every push.
    # Also runs on a pull request carrying the "run-evals" label, and then gates it.
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-evals'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the score table as a comment
    env:
      # Groq answers, Gemini grades: the judge is a different model from the generator.
      LLM_PROVIDER: groq
      JUDGE_PROVIDER: gemini
      # deepeval and ragas grade the smoke subset; promptfoo always runs the full golden set.
      EVAL_SUBSET: smoke
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }} # promptfoo's google: provider reads this name
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run deepeval regression suite
        run: pytest tests/test_deepeval.py -v

      - name: Run promptfoo regression tests
        working-directory: tests/promptfoo
        # The Gemini judge sometimes returns nothing ("No candidates returned"), which fails a
        # case through no fault of the bot. Go slower, then retry only the errored cases.
        run: |
          promptfoo eval --no-cache -j 2 --delay 1500 -o golden-results.json \
            || promptfoo eval --retry-errors --no-cache -j 1 --delay 3000 -o golden-results.json

      # promptfoo's table hides most rows, so list the failing cases explicitly.
      - name: Show failing promptfoo cases
        if: failure() && hashFiles('tests/promptfoo/golden-results.json') != ''
        working-directory: tests/promptfoo
        run: |
          python - <<'PY'
          import json
          data = json.load(open("golden-results.json"))
          for r in data["results"]["results"]:
              if not r["success"]:
                  print("FAIL:", r["testCase"]["description"])
                  print("   answer:", (r["response"] or {}).get("output", "")[:300].replace("\n", " "))
                  print("   reason:", r.get("error") or (r.get("gradingResult") or {}).get("reason", ""))
          PY

      - name: Run promptfoo red-team suite (3 runs per attack)
        working-directory: tests/promptfoo
        run: |
          promptfoo eval -c promptfooconfig.redteam.yaml --no-cache --repeat 3 -j 2 --delay 1500 \
            || promptfoo eval -c promptfooconfig.redteam.yaml --retry-errors --no-cache -j 1 --delay 3000

      # Cases with a known_issue (documented in the golden/red-team sets) are left out of
      # the gating runs above, so only a new failure turns CI red. They still run here,
      # report-only, so a fix shows up.
      - name: Known issues (report only)
        working-directory: tests/promptfoo
        continue-on-error: true
        env:
          KNOWN_ISSUES: only
        # Run both even if the first fails (a failing command would end the step), and
        # show each still-failing known issue as a warning on the run page.
        run: |
          promptfoo eval --no-cache || echo "::warning::Golden-set known issues still fail (expected until retrieval is fixed)"
          promptfoo eval -c promptfooconfig.redteam.yaml --no-cache || echo "::warning::Red-team known issues still fail (expected until retrieval is fixed)"

      - name: Run ragas quality report
        run: python tests/test_ragas.py

      - name: Upload ragas report artifact
        uses: actions/upload-artifact@v5
        with:
          name: ragas-report
          path: ragas_report.csv

      # Quality gate: golden accuracy and red-team block rate (3 runs each, generator only),
      # then every score against evals/thresholds.json. Fails the job, and so the PR, below it.
      - name: Pass rates for the gate
        run: |
          python evals/pass_rate.py --set golden --repeat 3
          python evals/pass_rate.py --set redteam --repeat 3

      - name: Quality gate
        run: python evals/quality_gate.py --markdown scores.md

      - name: Show scores on the run page
        if: always() && hashFiles('scores.md') != ''
        run: cat scores.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post scores as a PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('scores.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const body = require('fs').readFileSync('scores.md', 'utf8');
            const marker = '<!-- ai-quality-gate -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            const fullBody = marker + '\n' + body;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: fullBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: fullBody });
            }
