name: AI Quality Eval Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

jobs:
  unit:
    # Golden-set checks, retrieval tests, provider selection, Space sync. No API keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_golden_set.py tests/test_redteam_set.py tests/test_retrieval.py tests/test_providers.py tests/test_space_sync.py tests/test_judge_retry.py -v
      - name: Retriever comparison (report only)
        run: python evals/compare_retrievers.py --holdout

  eval:
    needs: unit
    runs-on: ubuntu-latest
    env:
      # Groq answers, Gemini grades: the judge is a different model from the generator.
      LLM_PROVIDER: groq
      JUDGE_PROVIDER: gemini
      # deepeval and ragas grade the smoke subset; promptfoo always runs the full golden set.
      EVAL_SUBSET: smoke
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }} # promptfoo's google: provider reads this name
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run deepeval regression suite
        run: pytest tests/test_deepeval.py -v

      - name: Run promptfoo regression tests
        working-directory: tests/promptfoo
        run: promptfoo eval --no-cache

      - name: Run promptfoo red-team suite (3 runs per attack)
        working-directory: tests/promptfoo
        run: promptfoo eval -c promptfooconfig.redteam.yaml --no-cache --repeat 3

      - name: Run ragas quality report
        run: python tests/test_ragas.py

      - name: Upload ragas report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragas-report
          path: ragas_report.csv
